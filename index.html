<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d12">
<title>抢购助手 · 秒级开抢控制台</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0b0d12; --bg2:#121620; --card:#161b26; --card2:#1d2331;
  --line:#252c3d; --txt:#eef2f8; --dim:#8b96ab; --dim2:#5d6779;
  --acc:#ff2d55; --acc2:#ff6b3d; --ok:#12d67c; --warn:#ffb020; --blue:#3d8bff;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body,div,section,header,nav,p,span,button,label,ul,ol,li{min-width:0}
img,svg{max-width:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
.app{max-width:1080px;margin:0 auto;padding:0 16px;width:100%}

/* ===== 顶部 ===== */
header{padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:9px;width:100%}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.htxt{min-width:0;flex:1}
.htxt h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htxt p{font-size:11px;margin:2px 0 0;color:var(--dim)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.clock{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;line-height:1.35}
.clock b{display:block;color:var(--txt);font-size:13px;font-weight:600}
.iconbtn{width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  color:var(--txt);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:active{transform:scale(.94)}

/* ===== 主卡片：倒计时 ===== */
.hero{background:linear-gradient(165deg,#1a2130 0%,var(--card) 55%,#141924 100%);
  border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px;position:relative;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.4);width:100%;max-width:100%}
.hero::before{content:"";position:absolute;top:-70px;right:-50px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,45,85,.22),transparent 68%);pointer-events:none}
.hero-top{display:flex;align-items:flex-start;gap:10px;position:relative;width:100%}
.hero-label{font-size:11px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
.hero-title{font-size:17px;font-weight:700;margin:6px 0 0;line-height:1.35;word-break:break-all;
  overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10.5px;
  font-weight:600;letter-spacing:.3px;white-space:nowrap;flex:none;max-width:100%}
.tag-live{background:rgba(255,45,85,.16);color:#ff7089;border:1px solid rgba(255,45,85,.3)}
.tag-plan{background:rgba(61,139,255,.16);color:#79b0ff;border:1px solid rgba(61,139,255,.3)}
.tag-done{background:rgba(18,214,124,.14);color:#4fe3a0;border:1px solid rgba(18,214,124,.28)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pl 1.4s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}

/* 倒计时数字 */
.cd{display:flex;align-items:baseline;justify-content:center;gap:0;margin:18px 0 0;
  font-variant-numeric:tabular-nums;position:relative;width:100%;max-width:100%;overflow:hidden}
.cd .num{font-size:clamp(40px,13.2vw,80px);font-weight:800;letter-spacing:-1px;line-height:1;
  background:linear-gradient(180deg,#fff,#a8b4c8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;flex:none;text-align:center;width:2ch;font-variant-numeric:tabular-nums;transition:color .2s}
.cd .sep{font-size:clamp(26px,8vw,44px);font-weight:700;color:var(--dim2);padding-bottom:.1em;flex:none}
.cd .ms{font-size:clamp(14px,4vw,22px);font-weight:700;color:var(--acc);margin-left:0;
  align-self:flex-end;padding-bottom:.3em;flex:none}
.cd.urgent .num{background:linear-gradient(180deg,#fff,#ff5c78);-webkit-background-clip:text;background-clip:text}
.cdunits{display:flex;justify-content:center;gap:0;font-size:10px;color:var(--dim2);
  letter-spacing:1px;margin-top:5px;white-space:nowrap}
.cdunits span{display:inline-block}

/* 时间条 */
.hero-meta{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;
  font-size:11.5px;color:var(--dim);flex-wrap:wrap;row-gap:5px}
.hero-meta .k{color:var(--dim2)}
.hero-meta b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}

/* 主按钮 */
.actions{display:flex;gap:10px;margin-top:16px;width:100%}
.btn{flex:1 1 0;min-width:0;border:none;border-radius:14px;padding:15px 10px;font-size:15px;font-weight:700;
  font-family:inherit;cursor:pointer;letter-spacing:.3px;transition:transform .1s,box-shadow .2s;
  display:flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.97)}
.btn-main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;
  box-shadow:0 6px 22px rgba(255,45,85,.34)}
.btn-ghost{flex:none;width:56px;background:var(--card2);color:var(--txt);border:1px solid var(--line);font-size:19px}

/* 快捷跳转行 */
.jumprow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px;width:100%}
.jbtn{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px 8px;
  color:var(--txt);font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden;white-space:nowrap}
.jbtn:active{transform:scale(.97)}
.jbtn small{color:var(--dim);font-weight:400;font-size:10.5px}

/* ===== 列表 ===== */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.sec-h h2{font-size:13.5px;margin:0;font-weight:700;letter-spacing:.2px}
.sec-h .cnt{font-size:11px;color:var(--dim2);font-weight:500}
.sec-h .more{margin-left:auto;font-size:11.5px;color:var(--blue);cursor:pointer;font-weight:500}

.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  margin-bottom:9px;position:relative;cursor:pointer;transition:border-color .15s,background .15s;
  width:100%;max-width:100%;overflow:hidden}
.item:active{background:var(--card2)}
.item.sel{border-color:rgba(255,45,85,.55);background:linear-gradient(180deg,rgba(255,45,85,.07),var(--card))}
.item.off{opacity:.5}
.irow{display:flex;align-items:flex-start;gap:9px;width:100%}
.iname{font-size:13.5px;font-weight:600;line-height:1.4;flex:1 1 0;min-width:0;word-break:break-all;
  overflow-wrap:anywhere}
.imeta{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums;flex-wrap:wrap;row-gap:4px;width:100%}
.imeta .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imeta .m{display:flex;align-items:center;gap:3.5px}
.icd{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--warn);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.icd.hot{color:var(--acc)}
.icd.done{color:var(--dim2)}
.plat{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--dim);
  border:1px solid var(--line);white-space:nowrap;font-weight:600}

.empty{text-align:center;padding:30px 16px;color:var(--dim2);font-size:12.5px;
  border:1px dashed var(--line);border-radius:14px;line-height:1.8}

/* ===== 底部导航 ===== */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,17,24,.94);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);
  display:flex;padding:8px 0 calc(6px + env(safe-area-inset-bottom));z-index:50}
nav button{flex:1;background:none;border:none;color:var(--dim2);font-family:inherit;font-size:10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;font-weight:500}
nav button .i{font-size:19px;line-height:1}
nav button.on{color:var(--acc)}

/* ===== 弹层 ===== */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:none;
  align-items:flex-end;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet.on{display:flex}
.sheet-in{background:var(--bg2);width:100%;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.9,.3,1);
  border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 14px}
.sheet h3{font-size:16px;margin:0 0 4px;font-weight:700}
.sheet .sub{font-size:11.5px;color:var(--dim);margin:0 0 16px;line-height:1.6}

.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px;font-weight:600;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;color:var(--txt);font-size:14px;font-family:inherit;
  -webkit-appearance:none;appearance:none;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field textarea{resize:vertical;min-height:64px;line-height:1.6;font-size:12.5px}
.field .hint{font-size:10.5px;color:var(--dim2);margin-top:5px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.chip{padding:8px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  color:var(--dim);font-size:12px;cursor:pointer;font-weight:600;font-family:inherit}
.chip.on{background:rgba(255,45,85,.14);border-color:rgba(255,45,85,.5);color:#ff7089}

.btn-full{width:100%;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:700;
  font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;
  margin-top:6px;box-shadow:0 6px 20px rgba(255,45,85,.26)}
.btn-full:active{transform:scale(.98)}
.btn-full.sec{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line);margin-top:9px}
.btn-full.danger{background:rgba(255,45,85,.12);color:#ff7089;border:1px solid rgba(255,45,85,.28);
  box-shadow:none;margin-top:9px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:rgba(32,38,52,.97);color:#fff;padding:11px 19px;border-radius:22px;font-size:12.5px;
  z-index:999;opacity:0;pointer-events:none;transition:all .26s;max-width:86vw;text-align:center;
  border:1px solid var(--line);line-height:1.5;font-weight:500}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 抢购浮层（全屏倒数） */
.full{position:fixed;inset:0;background:rgba(6,8,12,.97);z-index:200;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px}
.full.on{display:flex}
.full .fnum{font-size:clamp(80px,32vw,180px);font-weight:800;color:var(--acc);
  font-variant-numeric:tabular-nums;line-height:.95;letter-spacing:-4px}
.full .fhint{font-size:13px;color:var(--dim);margin-top:16px;text-align:center;line-height:1.7}
.full .fgo{margin-top:26px;padding:19px 52px;border-radius:50px;font-size:19px;font-weight:800;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;font-family:inherit;
  box-shadow:0 10px 40px rgba(255,45,85,.5);animation:breathe 1.1s infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.full .fclose{position:absolute;top:calc(18px + env(safe-area-inset-top));right:20px;width:40px;height:40px;
  border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:18px}

/* 帮助内容 */
.doc h4{font-size:13px;margin:18px 0 8px;color:var(--txt);font-weight:700}
.doc h4:first-child{margin-top:0}
.doc p,.doc li{font-size:12.5px;line-height:1.85;color:var(--dim);margin:0 0 8px}
.doc ol,.doc ul{padding-left:19px;margin:0 0 10px}
.doc li{margin-bottom:6px}
.doc b{color:var(--txt)}
.doc .warnbox{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.26);border-radius:11px;
  padding:12px 13px;margin:12px 0;font-size:12px;line-height:1.75;color:#ffd484}
.doc .okbox{background:rgba(18,214,124,.09);border:1px solid rgba(18,214,124,.24);border-radius:11px;
  padding:12px 13px;margin:12px 0;font-size:12px;line-height:1.75;color:#7fe9b8}
.doc code{background:var(--card2);padding:2px 6px;border-radius:5px;font-size:11.5px;
  color:#ffa8ba;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">⚡</div>
    <div class="htxt">
      <h1>抢购助手</h1>
      <p id="hsub">秒级开抢控制台</p>
    </div>
    <div class="hright">
      <div class="clock"><b id="clk">--:--:--</b><span id="clkms">校时中</span></div>
      <button class="iconbtn" onclick="openDoc()">?</button>
    </div>
  </header>

  <!-- 焦点卡片 -->
  <div class="hero" id="hero"></div>

  <!-- 即将开始 -->
  <div class="sec">
    <div class="sec-h">
      <h2>抢购清单</h2><span class="cnt" id="cntAll"></span>
      <span class="more" onclick="openEdit()">+ 新增</span>
    </div>
    <div id="list"></div>
  </div>
</div>

<nav>
  <button class="on" data-tab="home"><span class="i">⚡</span>抢购</button>
  <button data-tab="add"><span class="i">＋</span>新增</button>
  <button data-tab="doc"><span class="i">📖</span>指南</button>
  <button data-tab="set"><span class="i">⚙</span>设置</button>
</nav>

<!-- 编辑弹层 -->
<div class="sheet" id="shEdit" onclick="if(event.target===this)closeSheet('shEdit')">
  <div class="sheet-in">
    <div class="grab"></div>
    <h3 id="editTitle">新增抢购目标</h3>
    <p class="sub">填入商品链接与开抢时间。到点后会自动弹出全屏倒数并在最后一刻用最大音量提醒。</p>

    <div class="field">
      <label>平台</label>
      <div class="chips" id="platChips"></div>
    </div>
    <div class="field">
      <label>商品/券链接</label>
      <input id="fLink" placeholder="粘贴抖音/美团/淘宝等分享链接" autocomplete="off">
      <div class="hint" id="linkHint">支持短链，粘贴后自动识别平台与活动 ID</div>
    </div>
    <div class="field">
      <label>名称</label>
      <input id="fName" placeholder="如：大餐美食早鸟券 A 券" autocomplete="off">
    </div>
    <div class="row2">
      <div class="field">
        <label>开抢时间</label>
        <input id="fTime" type="datetime-local" step="1">
      </div>
      <div class="field">
        <label>提前提醒（秒）</label>
        <select id="fLead">
          <option value="0">到点才提醒</option>
          <option value="30">提前 30 秒</option>
          <option value="60" selected>提前 1 分钟</option>
          <option value="180">提前 3 分钟</option>
          <option value="300">提前 5 分钟</option>
          <option value="600">提前 10 分钟</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>备注（可选）</label>
      <textarea id="fNote" placeholder="如：需要两张、仅限APP购买、限购1张…"></textarea>
    </div>

    <button class="btn-full" onclick="saveItem()">保存</button>
    <button class="btn-full danger" id="delBtn" onclick="delItem()" style="display:none">删除此项</button>
  </div>
</div>

<!-- 设置弹层 -->
<div class="sheet" id="shSet" onclick="if(event.target===this)closeSheet('shSet')">
  <div class="sheet-in">
    <div class="grab"></div>
    <h3>设置</h3>
    <p class="sub">这些偏好只存在本机浏览器，不上传。</p>

    <div class="field">
      <label>提前打开 App（秒）</label>
      <select id="sPreopen">
        <option value="0">不自动跳转</option>
        <option value="3">提前 3 秒</option>
        <option value="5" selected>提前 5 秒</option>
        <option value="8">提前 8 秒</option>
        <option value="10">提前 10 秒</option>
      </select>
      <div class="hint">到点前这几秒自动尝试跳转 App，进入后你只需按顺序点两下。</div>
    </div>
    <div class="field">
      <label>声音提醒</label>
      <div class="chips" id="sndChips">
        <button class="chip on" data-v="1">开启</button>
        <button class="chip" data-v="0">关闭</button>
      </div>
    </div>
    <div class="field">
      <label>震动提醒（iPhone 需允许）</label>
      <div class="chips" id="vibChips">
        <button class="chip on" data-v="1">开启</button>
        <button class="chip" data-v="0">关闭</button>
      </div>
    </div>
    <div class="field">
      <label>时间校准源</label>
      <select id="sCalib">
        <option value="auto" selected>自动（网络校时）</option>
        <option value="local">只用本机时间</option>
      </select>
      <div class="hint">抢券对时间敏感，网络校时可消除手机时间误差（通常几十毫秒）。</div>
    </div>

    <button class="btn-full" onclick="saveSet()">保存设置</button>
    <button class="btn-full sec" onclick="exportData()">导出数据备份</button>
    <button class="btn-full sec" onclick="importData()">导入数据</button>
    <button class="btn-full sec" onclick="testNotify()">测试提醒</button>
  </div>
</div>

<!-- 指南弹层 -->
<div class="sheet" id="shDoc" onclick="if(event.target===this)closeSheet('shDoc')">
  <div class="sheet-in doc" id="docBody"></div>
</div>

<!-- 全屏倒数 -->
<div class="full" id="full">
  <button class="fclose" onclick="closeFull()">✕</button>
  <div class="fhint" id="fTitle" style="margin:0 0 10px;font-size:14px;color:var(--txt)"></div>
  <div class="fnum" id="fNum">10</div>
  <div class="fhint" id="fHint">准备中…</div>
  <button class="fgo" id="fGo" onclick="doJump()">打开 App ↗</button>
</div>

<div id="toast"></div>
<input type="file" id="fileIn" accept=".json" style="display:none">

<script src="platforms.js"></script>
<script>
/* ============ 数据层 ============ */
const LS='qg_items_v1', LSS='qg_set_v1';
// 平台信息统一由 platforms.js 提供，这里做一层兼容映射
const PLATS={};
Object.keys(window.PLATFORMS).forEach(k=>{
  const p=window.PLATFORMS[k];
  PLATS[k]={name:p.name,ico:p.icon,scheme:p.scheme,color:p.color,prep:p.prep,steps:p.steps};
});
let items=[], curId=null, S={preopen:5,sound:1,vib:1,calib:'auto'}, clockOffset=0;
let editId=null, editPlat='douyin';

function load(){
  try{items=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){items=[]}
  try{Object.assign(S,JSON.parse(localStorage.getItem(LSS)||'{}'))}catch(e){}
}
function save(){localStorage.setItem(LS,JSON.stringify(items))}
function saveS(){localStorage.setItem(LSS,JSON.stringify(S))}

/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
function now(){return Date.now()+clockOffset}
function toast(m,ms=2000){const t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms)}
function pad(n,w=2){return String(Math.floor(Math.abs(n))).padStart(w,'0')}
function fmtFull(ts){const d=new Date(ts);
  return `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}

/* 网络校时：取响应 Date 头，用 RTT/2 修正 */
async function calibrate(){
  if(S.calib==='local'){$('clkms').textContent='本机时间';return}
  const urls=['https://api.github.com/','https://www.baidu.com/'];
  let best=null;
  for(const u of urls){
    const t0=Date.now();
    try{
      const r=await fetch(u,{method:'HEAD',cache:'no-store',mode:'cors'});
      const t1=Date.now(), rtt=t1-t0;
      const ds=r.headers.get('date');
      if(!ds)continue;
      const srv=new Date(ds).getTime();
      // 服务器 Date 精度为秒，取中点估计
      const est=srv+500+Math.floor(rtt/2);
      const off=est-t1;
      if(best===null||Math.abs(off)<Math.abs(best))best=off;
    }catch(e){}
  }
  if(best!==null){
    clockOffset=best;
    $('clkms').textContent=(best>=0?'+':'')+Math.round(best)+'ms';
    $('clkms').style.color=Math.abs(best)<300?'var(--ok)':'var(--warn)';
  }else{$('clkms').textContent='校时失败'}
}

/* ============ 渲染 ============ */
function statusOf(it){
  if(!it.time) return {k:'unset',txt:'待设时间',cls:'tag-plan'};
  const t=now(), left=it.time-t;
  if(left<=0) return {k:'live',txt:'进行中',cls:'tag-live'};
  if(left<3600e3) return {k:'soon',txt:'即将开抢',cls:'tag-live'};
  return {k:'plan',txt:'待开抢',cls:'tag-plan'};
}
function cdText(ms){
  if(ms<=0)return '已开抢';
  const s=Math.floor(ms/1000),d=Math.floor(s/86400);
  const h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60;
  if(d>0)return `${d}天 ${pad(h)}:${pad(m)}:${pad(ss)}`;
  if(h>0)return `${pad(h)}:${pad(m)}:${pad(ss)}`;
  return `${pad(m)}:${pad(ss)}`;
}

function render(){
  const t=now();
  const sorted=[...items].sort((a,b)=>a.time-b.time);
  // 焦点：优先最近的未开始项，否则最近项
  let focus=sorted.find(i=>i.id===curId)||sorted.find(i=>i.time>t)||sorted[0];
  renderHero(focus,t);
  renderList(sorted,t);
  $('cntAll').textContent=items.length?`${items.length} 项`:'';
}
function renderHero(it,t){
  const h=$('hero');
  if(!it){
    h.innerHTML=`<div class="hero-top"><div>
      <div class="hero-label">当前焦点</div>
      <p class="hero-title" style="color:var(--dim)">还没有抢购目标</p></div></div>
      <div class="cd" style="opacity:.25"><span class="num">00</span><span class="sep">:</span><span class="num">00</span></div>
      <div class="cdunits"><span style="width:2ch">分</span><span style="width:.5em"></span><span style="width:2ch">秒</span></div>
      <button class="btn btn-main" style="margin-top:18px" onclick="openEdit()">＋ 添加第一个目标</button>`;
    return;
  }
  const st=statusOf(it), left=it.time-t, P=PLATS[it.plat]||PLATS.other;
  let body;
  if(!it.time){
    body=`<div class="cd" style="opacity:.3"><span class="num">--</span><span class="sep">:</span><span class="num">--</span></div>
      <div class="cdunits"><span style="letter-spacing:0;color:var(--dim)">还没设定开抢时间</span></div>
      <div style="margin-top:16px"><button class="btn btn-main" onclick="openEdit('${it.id}')">设定开抢时间</button></div>`;
  }else if(left>0){
    const s=Math.floor(left/1000);
    const d=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
    const ms=Math.floor(left%1000);
    if(d>0){
      body=`<div class="cd"><span class="num" style="width:auto;min-width:1.2ch">${d}</span><span class="sep">天</span>
        <span class="num">${pad(hh)}</span><span class="sep">:</span><span class="num">${pad(mm)}</span></div>
        <div class="cdunits" style="gap:0;letter-spacing:2px"><span>天</span><span style="width:1.2em"></span><span>时</span><span style="width:.6em"></span><span>分</span></div>`;
    }else{
      body=`<div class="cd${left<60000?' urgent':''}">
        <span class="num">${pad(mm)}</span><span class="sep">:</span>
        <span class="num">${pad(ss)}</span><span class="ms">.${pad(ms,3)}</span></div>
        <div class="cdunits"><span style="width:2ch">分</span><span style="width:.5em"></span><span style="width:2ch">秒</span><span style="width:3.6ch">毫秒</span></div>`;
    }
  }else{
    const over=t-it.time;
    body=`<div class="cd urgent"><span class="num" style="font-size:clamp(32px,10vw,56px);width:auto">已开抢</span></div>
      <div class="cdunits" style="margin-top:8px"><span style="letter-spacing:0;color:var(--dim)">${cdText(over)} 前开售</span></div>`;
  }
  h.innerHTML=`
    <div class="hero-top">
      <div style="flex:1;min-width:0">
        <div class="hero-label">当前焦点 · ${P.name}</div>
        <p class="hero-title">${esc(it.name)}</p>
      </div>
      <span class="tag ${st.cls}"><span class="dot"></span>${st.txt}</span>
    </div>
    ${body}
    <div class="hero-meta">
      ${it.time?`<span><span class="k">开抢</span> <b>${fmtFull(it.time)}</b></span>`:'<span style="color:var(--dim2)">点「设定开抢时间」填入直播间上架时刻</span>'}
      ${it.lead?`<span><span class="k">提醒</span> <b>提前${it.lead}s</b></span>`:''}
      ${it.actId?`<span><span class="k">ID</span> <b>${it.actId.slice(-6)}</b></span>`:''}
    </div>
    <div class="actions">
      <button class="btn btn-main" onclick="jumpNow()">立即打开 → 下单</button>
      ${it.time?`<button class="btn btn-ghost" onclick="startFull('${it.id}')">⏱</button>`:''}
    </div>
    <div class="jumprow">
      <button class="jbtn" onclick="copyLink('${it.id}')">📋 复制链接 <small>手动粘贴</small></button>
      <button class="jbtn" onclick="editItem('${it.id}')">✏️ 编辑 <small>改时间/名称</small></button>
    </div>`;
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function renderList(sorted,t){
  const el=$('list');
  if(!sorted.length){
    el.innerHTML=`<div class="empty">还没有目标<br>点右上角「+ 新增」，或底部「＋」</div>`;
    return;
  }
  el.innerHTML=sorted.map(it=>{
    const st=statusOf(it), P=PLATS[it.plat]||PLATS.other;
    const left=it.time-t;
    const cd=!it.time?'未设时间':(left>0?cdText(left):'已开抢');
    const hot=it.time&&left>0&&left<600e3;
    return `<div class="item ${it.id===curId?'sel':''} ${left<0?'off':''}" onclick="focusItem('${it.id}')">
      <div class="irow">
        <div class="iname">${esc(it.name)}</div>
      </div>
      <div class="imeta">
        <span class="plat">${P.ico} ${P.name}</span>
        <span class="m">🕐 ${it.time?fmtFull(it.time):'--'}</span>
        <span class="icd ${hot?'hot':''} ${left<0?'done':''}">${cd}</span>
      </div>
    </div>`;
  }).join('');
}

/* ============ 交互 ============ */
function focusItem(id){curId=id;render();window.scrollTo({top:0,behavior:'smooth'})}

function openEdit(id){
  editId=id||null;
  const it=id?items.find(i=>i.id===id):null;
  $('editTitle').textContent=it?'编辑目标':'新增抢购目标';
  $('delBtn').style.display=it?'block':'none';
  editPlat=it?it.plat:'douyin';
  $('fLink').value=it?it.link:'';
  $('fName').value=it?it.name:'';
  $('fTime').value=it?toLocalInput(it.time):defaultTimeInput();
  $('fLead').value=it?String(it.lead??60):'60';
  $('fNote').value=it?(it.note||''):'';
  renderPlatChips();
  if(it)detectLink(true);
  openSheet('shEdit');
}
function defaultTimeInput(){
  const d=new Date(Date.now()+10*60*1000);
  return toLocalInput(d.getTime());
}
function toLocalInput(ts){
  const d=new Date(ts), z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}
function renderPlatChips(){
  $('platChips').innerHTML=Object.entries(PLATS).map(([k,p])=>
    `<button class="chip ${k===editPlat?'on':''}" onclick="setPlat('${k}')">${p.ico} ${p.name}</button>`).join('');
}
function setPlat(k){editPlat=k;renderPlatChips();detectLink(true)}

function detectLink(quiet){
  const v=$('fLink').value.trim();
  let plat=editPlat, hint='粘贴后自动识别平台与活动 ID';
  if(/douyin\.com|iesdouyin|life\.scsjsd|snssdk/i.test(v))plat='douyin';
  else if(/meituan\.com|dianping\.com|m\.meituan/i.test(v))plat=/dianping/i.test(v)?'dianping':'meituan';
  else if(/taobao\.com|tb\.cn|tmall/i.test(v))plat='taobao';
  else if(/jd\.com|3\.cn/i.test(v))plat='jd';
  else if(/yangkeduo|pinduoduo/i.test(v))plat='pdd';
  if(plat!==editPlat){editPlat=plat;renderPlatChips()}
  const act=v.match(/activity_id=(\d+)/);
  if(act)hint=`已识别活动 ID：<span style="color:var(--ok)">${act[1]}</span>`;
  else if(v&&/^https?:/i.test(v))hint='短链已接受，点击时会自动跟随跳转';
  $('linkHint').innerHTML=hint;
  // 自动填名称
  if(!quiet&&!$('fName').value.trim()&&v){
    let g='';
    try{const u=new URL(v);g=u.hostname.replace(/^www\./,'')}catch(e){}
    $('fName').value=(PLATS[plat]?.name||'')+' 券 '+(act?act[1].slice(-6):'');
  }
}

function saveItem(){
  const link=$('fLink').value.trim();
  const name=$('fName').value.trim();
  const tv=$('fTime').value;
  if(!name){toast('请填写名称');return}
  if(!tv){toast('请选择开抢时间');return}
  const time=new Date(tv).getTime();
  if(isNaN(time)){toast('时间格式不对');return}
  const obj={id:editId||('q'+Date.now()+Math.random().toString(36).slice(2,6)),
    name,link,plat:editPlat,time,lead:Number($('fLead').value)||0,note:$('fNote').value.trim()};
  if(editId){const i=items.findIndex(x=>x.id===editId);items[i]=obj}
  else items.push(obj);
  save();
  if(!curId)curId=obj.id;
  closeSheet('shEdit');render();toast(editId?'已更新':'已添加');
  if(!editId&&confirmArmed!==null){}
}
function editItem(id){openEdit(id)}
function delItem(){
  if(!editId)return;
  if(!confirm('确定删除这个抢购目标？'))return;
  items=items.filter(x=>x.id!==editId);
  if(curId===editId)curId=items[0]?.id||null;
  save();closeSheet('shEdit');render();toast('已删除');
}
function copyLink(id){
  const it=items.find(i=>i.id===id); if(!it||!it.link){toast('没有链接');return}
  navigator.clipboard?.writeText(it.link).then(()=>toast('链接已复制，去 App 粘贴'),()=>{
    const ta=document.createElement('textarea');ta.value=it.link;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();toast('链接已复制');
  });
}

/* ============ 跳转 ============ */
function deepLink(it){
  const P=PLATS[it.plat]||PLATS.other;
  // 抖音：优先用短链（App 会接管），通用 web 承接
  if(it.plat==='douyin'&&it.link)return it.link;
  if(P.scheme&&it.link){
    // 尝试 scheme 唤醒 App 并带入链接
    return P.scheme;
  }
  return it.link||'';
}
function jumpNow(){
  const it=items.find(i=>i.id===curId); if(!it)return;
  const url=deepLink(it);
  if(!url){toast('没有可跳转的链接');return}
  logTry(it,'手动打开');
  // 先试 App scheme（同一手势内允许），再回落 http
  const P=PLATS[it.plat]||PLATS.other;
  if(P.scheme&&it.plat!=='douyin'){
    const t0=Date.now();
    location.href=P.scheme;
    setTimeout(()=>{ if(Date.now()-t0<1800 && document.visibilityState==='visible') location.href=url; },900);
  }else{
    location.href=url;
  }
}
function logTry(it,how){
  it.tries=it.tries||[]; it.tries.push({t:now(),how});
  it.lastTry=now(); save();
}

/* ============ 全屏倒数 ============ */
let fullId=null, fullTimer=null, preopened=false;
function startFull(id){
  fullId=id; const it=items.find(i=>i.id===id); if(!it)return;
  preopened=false;
  $('fTitle').textContent=it.name;
  $('full').classList.add('on');
  tickFull(true);
  clearInterval(fullTimer); fullTimer=setInterval(()=>tickFull(false),50);
}
function closeFull(){$('full').classList.remove('on');clearInterval(fullTimer);fullTimer=null}
function tickFull(first){
  const it=items.find(i=>i.id===fullId); if(!it){closeFull();return}
  const left=it.time-now();
  if(left>0){
    const s=Math.ceil(left/1000);
    $('fNum').textContent=s>99?Math.ceil(s/60)+'′':s;
    $('fHint').innerHTML= s>99 ? '还有约 '+Math.ceil(s/60)+' 分钟' : '盯住屏幕，到 0 秒立即点击下方按钮';
    $('fGo').textContent='打开 App ↗';
    // 提前跳转
    if(S.preopen>0 && left<=S.preopen*1000 && !preopened){
      preopened=true; beep(3); doJump(true);
    }else if(left<=5000 && left>4500 && first!==false){ beep(1); }
  }else{
    $('fNum').textContent='0';
    const over=-left;
    $('fHint').innerHTML='<span style="color:var(--acc)">已开抢 '+Math.floor(over/1000)+' 秒</span> · 立即下单！';
    $('fGo').textContent='立即下单 ↗';
    if(over<3000&&!fullId._rang){fullId._rang=true;beep(2);vibrate([180,90,180,90,380])}
  }
}
function doJump(auto){
  const it=items.find(i=>i.id===fullId); if(!it)return;
  logTry(it,auto?'自动跳转':'点击跳转');
  jumpItem(it);
}
function jumpItem(it){
  const P=PLATS[it.plat]||PLATS.other;
  if(it.plat==='douyin'&&it.link){location.href=it.link;return}
  if(P.scheme){location.href=P.scheme;return}
  if(it.link)location.href=it.link;
}

/* 声音：WebAudio 合成，不依赖音频文件 */
let actx=null;
function beep(kind){
  if(!S.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const seq=kind===1?[[880,.08]]:kind===2?[[1200,.1],[1200,.1],[1600,.18]]:[[660,.09],[880,.09],[1100,.12]];
    let t=actx.currentTime;
    seq.forEach(([f,d])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.28,t+.01);
      g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g);g.connect(actx.destination);
      o.start(t);o.stop(t+d+.02);
      t+=d+.02;
    });
  }catch(e){}
}
function vibrate(p){if(S.vib&&navigator.vibrate)navigator.vibrate(p)}

/* ============ 提醒循环 ============ */
let lastAlert={};
function alertLoop(){
  const t=now();
  items.forEach(it=>{
    if(!it.time)return;
    const left=it.time-t;
    const fireAt=it.time-(it.lead||0)*1000;
    // 提醒窗口
    if(left>0&&t>=fireAt&&!lastAlert[it.id+'_lead']){
      lastAlert[it.id+'_lead']=1;
      if(!fullId){beep(3);vibrate([100,60,100]);toast('⏰ '+it.name+' 即将开抢',2600)}
    }
    // 到点
    if(left<=0&&left>-15000&&!lastAlert[it.id+'_go']){
      lastAlert[it.id+'_go']=1;
      notifyGo(it);
    }
    if(left>0){lastAlert[it.id+'_go']=0; if(left>(it.lead||0)*1000+5000)lastAlert[it.id+'_lead']=0}
  });
}
function notifyGo(it){
  beep(2);vibrate([200,100,200,100,400]);
  if(!fullId&&it.id===curId) startFull(it.id);
  else if(!fullId) toast('🔥 '+it.name+' 已开抢！点开抢购',3000);
  // 系统通知（需用户允许，前台时用页内提醒）
  if('Notification' in window && Notification.permission==='granted'){
    try{new Notification('🔥 已开抢：'+it.name,{body:'立即打开 App 下单',tag:it.id})}catch(e){}
  }
}
function testNotify(){
  beep(2);vibrate([200,100,200]);
  toast('🔔 提醒测试：声音 + 震动',2500);
}

/* ============ 设置 ============ */
function openSet(){
  $('sPreopen').value=String(S.preopen);
  $('sCalib').value=S.calib;
  bindChips('sndChips',S.sound,v=>{S.sound=v});
  bindChips('vibChips',S.vib,v=>{S.vib=v});
  openSheet('shSet');
}
function bindChips(id,val,cb){
  const box=$(id);
  box.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('on',Number(c.dataset.v)===Number(val));
    c.onclick=()=>{
      box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); cb(Number(c.dataset.v));
    };
  });
}
function saveSet(){
  S.preopen=Number($('sPreopen').value); S.calib=$('sCalib').value;
  saveS(); closeSheet('shSet'); toast('设置已保存');
}
function exportData(){
  const blob=new Blob([JSON.stringify({items,set:S,exportedAt:new Date().toISOString()},null,2)],
    {type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='抢购清单_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); toast('已导出');
}
function importData(){ $('fileIn').click() }
$('fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(Array.isArray(d.items)){items=d.items;save()}
      if(d.set)Object.assign(S,d.set),saveS();
      render();toast('已导入 '+items.length+' 项');
    }catch(err){toast('文件格式不对')}
  };
  r.readAsText(f);
};

    <li>进入 App 后，券在<b>直播间右下角购物袋</b>里，不是商品页——要看主播是挂车还是发券。</li>
    <li>挂车：点购物袋 → 找到券 → 点「立即购买」→ 确认订单。</li>
    <li>发券（口令/弹窗）：听主播口令，弹窗出来直接点「抢」。</li>
    <li><b>提前登录、提前绑好支付方式</b>，否则到支付页会卡在输密码。</li>
  </ol>

  <h4>④ iPhone 提速的三个开关</h4>
  <ul>
    <li><b>设置 → 辅助功能 → 触控 → 辅助触控</b>：开启后屏幕上多一个圆点，可以把它放在「立即购买」的位置，用另一只手连点。</li>
    <li><b>设置 → 通知 → 抖音</b>：允许通知。直播间开播/上架可能有推送。</li>
    <li><b>设置 → 显示与亮度 → 自动锁定</b>：改成「永不」，避免抢购时息屏。</li>
  </ul>

  <h4>⑤ 用「快捷指令」做一键入口</h4>
  <p>快捷指令 App → 新建 → 添加操作「打开 URL」→ 粘贴券链接 → 命名为「抢A券」→ 添加到主屏幕。</p>
  <p>这样桌面就有个按钮，<b>点一下直接进券页面</b>，比微信里翻聊天记录快得多。</p>

  <h4>⑥ 时间一定要准</h4>
  <p>页面右上角会显示校时偏差。绿色（±300ms 内）就够用；显示黄色说明手机时间偏差大，去「设置 → 通用 → 日期与时间」打开「自动设置」。</p>

  <div class="okbox">
    <b>关于成功率，说实话</b><br>
    券是有限的，几万人同时抢 1000 张，任何工具都不可能保证抢到。这套东西做的是：<b>让你不输在自己的操作速度上</b>——清除等待、清除找入口、清除输密码的时间。剩下的是运气和网络。
  </div>

  <h4>⑦ 怎么加新的平台</h4>
  <p>新增时选对应平台即可。抖音、美团、点评、淘宝、京东、拼多多都支持短链识别。其他平台选「其他」，直接粘链接也能跳。</p>
